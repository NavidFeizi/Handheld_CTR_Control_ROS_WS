# Single source of truth for the EM tracker node parameters.
emt_node:
  ros__parameters:
    sample_time: 0.025
    cutoff_freq: 6.6            # Hz, node-side Butterworth on the tool poses
    send_on_igtl: false
    enable_position_logging: false
    host_name: "/dev/ttyUSB1"   # NDI Aurora serial device (production value)
    emtracker_data_dir: ""      # empty -> $HOME/Documents/handheld_CTR/emtracker_config/
